jtag:
  title: Unbrick via JTAG
  intro: 'This procedure loads a FPGA image into RAM via USB JTAG cable.

    The USRP will become operational again (temporary — until power-cycle).

    Then you should flash the image permanently via network.'
  no_djtgcfg: djtgcfg is not installed.
  install_guide_title: 'How to install Digilent Adept Utilities:'
  install_guide_win: "1. Visit: https://digilent.com/reference/software/adept/start\n\
    \   2. Download 'Adept 2 Runtime' and 'Adept Utilities' for Windows.\n   3. Install\
    \ both, then re-run usrp-manager."
  install_guide_linux: "1. Visit: https://digilent.com/reference/software/adept/start\n\
    \   2. Download .deb or .rpm packages for Linux.\n   3. sudo dpkg -i digilent.adept.runtime_*.deb\n\
    \   4. sudo dpkg -i digilent.adept.utilities_*.deb"
  install_guide_mac: "1. Visit: https://digilent.com/reference/software/adept/start\n\
    \   2. Download the macOS package and install."
  enumerating: Enumerating JTAG devices...
  no_devices: "No JTAG devices found.\n   • Check that the USB JTAG cable is connected\
    \ to the USRP JTAG port\n   • Check that the USRP is powered on\n   • Try a different\
    \ USB cable or port"
