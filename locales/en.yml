jtag:
  title: "Unbrick via JTAG"
  intro: "This procedure loads a FPGA image into RAM via USB JTAG cable.\nThe USRP will become operational again (temporary — until power-cycle).\nThen you should flash the image permanently via network."
  no_djtgcfg: "djtgcfg is not installed."
  install_guide_title: "How to install Digilent Adept Utilities:"
  install_guide_win: "1. Visit: https://digilent.com/reference/software/adept/start\n   2. Download 'Adept 2 Runtime' and 'Adept Utilities' for Windows.\n   3. Install both, then re-run usrp-manager."
  install_guide_linux: "1. Visit: https://digilent.com/reference/software/adept/start\n   2. Download .deb or .rpm packages for Linux.\n   3. sudo dpkg -i digilent.adept.runtime_*.deb\n   4. sudo dpkg -i digilent.adept.utilities_*.deb"
  install_guide_mac: "1. Visit: https://digilent.com/reference/software/adept/start\n   2. Download the macOS package and install."
  enumerating: "Enumerating JTAG devices..."
  no_devices: "No JTAG devices found.\n   • Check that the USB JTAG cable is connected to the USRP JTAG port\n   • Check that the USRP is powered on\n   • Try a different USB cable or port"
  select_device: "Select JTAG device:"
  initializing: "Initializing JTAG scan chain..."
  fpga_detected: "Detected FPGA: %{fpga} → USRP %{usrp}"
  fpga_unknown: "FPGA detected but model not recognized: %{id}\n   This USRP model may not be supported yet."
  select_variant: "Select FPGA variant:"
  variant_hg: "HG — 1 Gigabit Port 0, 10 Gigabit Port 1 (most common)"
  variant_xg: "XG — 10 Gigabit on both ports"
  select_bitstream: "Select FPGA image (.bit file):"
  bitstream_local: "[local]  %{name}"
  bitstream_download: "[download from GitHub]  v%{version} — %{size}"
  no_bitstream: "No FPGA image available. Please download one from 'Manage FPGA Images'."
  programming: "Programming FPGA via JTAG. Do not disconnect cables..."
  success: "JTAG programming succeeded!"
  success_detail: "The FPGA is now running the image in volatile RAM.\nThis will be lost on power-cycle."
  offer_permanent: "Flash this image permanently to internal flash now? (recommended)"
  already_bricked_tip: "If JTAG programming failed, check the USB cable is in the JTAG port (not the USB3 port)."

flash:
  title: "Flash FPGA via Network (permanent)"
  intro: "This writes the FPGA image to the USRP's internal flash memory.\nThe image persists after power-cycle.\nRequires: Ethernet cable to SFP0 port + correct IP configuration."
  no_uhd: "UHD is not installed or not in PATH. Please install UHD first."
  enter_ip: "USRP IP address"
  pinging: "Pinging %{ip}..."
  ping_ok: "USRP is reachable at %{ip}"
  ping_fail: "Cannot reach %{ip}. Possible causes:"
  ping_fix1: "  • Ethernet cable must be connected to SFP0 (Port 0) with a 1G SFP transceiver"
  ping_fix2: "  • Set your host IP to 192.168.10.1 / mask 255.255.255.0"
  ping_fix3: "  • If USRP is bricked (no LEDs) → use 'Unbrick via JTAG' first"
  finding: "Detecting USRP with uhd_find_devices..."
  find_fail: "UHD cannot communicate with the USRP.\n   Possible cause: UHD version mismatch with FPGA image."
  mismatch_hint: "Try 'Manage UHD Drivers' to install the matching UHD version."
  select_variant: "Select FPGA variant to flash:"
  confirm_flash: "This will permanently overwrite the USRP's internal FPGA flash. Continue?"
  flashing: "Flashing FPGA image. Do not power off the USRP..."
  success: "Flash complete! Power-cycle the USRP now."
  reboot_reminder: "IMPORTANT: Turn the USRP off, wait 5 seconds, then turn it back on."

