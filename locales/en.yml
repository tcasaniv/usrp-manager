  model_instructions_title: Physical Instructions by Model
  select_model_prompt: 'Select your model to see connection instructions:'
  model_n210_label: USRP N200 / N210 (S2 Button / Safe Mode)
  model_x300_label: USRP X300 / X310 (Front micro-USB JTAG)
  model_b200_label: USRP B200 / B210 (Automatic load over USB 3.0)
  proc_n210_title: SAFE MODE PROCEDURE (N200 / N210)
  proc_n210_step1: 1. Power off USRP N210 by unplugging the power supply.
  proc_n210_step2: 2. Hold down the S2 button (small push-button on front or internal
    board) while plugging power back in.
  proc_n210_step3: 3. This forces the USRP to boot from safe fallback image at IP
    192.168.10.2.
  proc_n210_step4: 4. If it still does not respond, connect Digilent USB-JTAG to 6-pin
    header.
  proc_x300_title: JTAG PROCEDURE FOR X300 / X310
  proc_x300_step1: 1. Connect a standard micro-USB cable to the front port labeled
    'JTAG'.
  proc_x300_step2: 2. Turn on the device using the power switch.
  proc_x300_step3: 3. Integrated FTDI / Digilent adapters will be autodetected by
    the system.
  b200_info: 'USRP B200/B210 does not use external JTAG: it loads its FPGA dynamically
    over USB 3.0.'
