  success: Flash complete! Power-cycle the USRP now.
  reboot_reminder: 'IMPORTANT: Turn the USRP off, wait 5 seconds, then turn it back
    on.'
  what_title: How does Permanent Flashing work?
  what_body: 'This wizard writes an FPGA image to the USRP internal non-volatile flash
