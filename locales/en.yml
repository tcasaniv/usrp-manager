    cannot boot,

    leaving LEDs off or failing on network. This does NOT damage hardware:

    the FPGA can be revived via JTAG.'
  how_jtag_works: How does JTAG recovery work?
  how_jtag_works_body: 'The USB JTAG cable programs the FPGA directly in volatile
    RAM.

    The device will power on again immediately.'
