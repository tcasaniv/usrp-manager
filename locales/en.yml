  title: Guide & Education
  select_topic: 'Select a topic:'
  topic_what_usrp: What is a USRP? (and what is SDR?)
  topic_fpga: What is FPGA and why does the version matter?
  topic_antennas: '⚠  Antennas: RF safety and frequency ranges'
