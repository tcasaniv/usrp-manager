  edu_what_title: What is a USRP? (and what is SDR?)
  edu_what_sec1: ● What is SDR?
  edu_what_body1: "  A USRP (Universal Software Radio Peripheral) is a hardware device\n\
    \  made by Ettus Research (National Instruments / Emerson) that acts\n  as a Software-Defined\
    \ Radio (SDR)."
  edu_what_sec2: ● How does it work?
  edu_what_body2: "  Instead of fixed hardware circuits for each radio standard (Wi-Fi,\n\
    \  LTE, FM, etc.), an SDR uses a general-purpose processor + FPGA to handle\n\
    \  signal processing in software. This enables: FM/AM reception, GSM/LTE/5G,\n\
    \  radar simulation, satellite communication, and spectrum analysis."
  edu_what_sec3: ● Role of the FPGA
  edu_what_body3: "  The FPGA handles real-time digital signal processing (DDC/DUC,\n\
    \  filters, packet framing) too fast for general CPUs. The host PC runs UHD\n\
    \  to communicate with the FPGA over Ethernet or USB."
  edu_what_sec4: ● Why versions matter
  edu_what_body4: "  UHD host drivers and the FPGA image must come from matching versions.\n\
    \  If they differ, communication breaks and the USRP will not function."
  edu_fpga_title: FPGA & Why Versions Matter
  edu_fpga_sec1: ● What is an FPGA?
  edu_fpga_body1: "  FPGA = Field-Programmable Gate Array. A reconfigurable chip providing\n\
    \  hardware-speed processing for ADC/DAC routing, filtering, and framing."
  edu_fpga_sec2: ● The FPGA image (.bit / .bin file)
  edu_fpga_body2: "  The binary bitstream loaded onto the FPGA. Each UHD version expects\n\
    \  a specific protocol version implemented inside the FPGA image."
  edu_fpga_sec3: '● ⚠  Critical: version matching'
  edu_fpga_body3: "  UHD version and FPGA image version must match (e.g. UHD 4.10\
    \ with 4.10 image).\n  Mismatches trigger compatibility errors during uhd_find_devices\
    \ or uhd_usrp_probe."
  edu_fpga_sec4: ● How to check
  edu_fpga_body4: '  Use ''System Diagnostic'' in this tool to verify active UHD vs
    cached FPGA images.'
  edu_ant_title: 'Antennas: RF Safety & Frequency Ranges'
  edu_ant_warn: READ THIS BEFORE CONNECTING ANY ANTENNA OR TRANSMITTING
  edu_ant_sec1: ● Never transmit without a proper antenna or 50Ω load
  edu_ant_body1: "  Transmitting into an open port reflects RF power back into the\
    \ power\n  amplifier, risking permanent hardware burnout."
  edu_ant_sec2: ● Antenna frequency ratings & legality
  edu_ant_body2: "  Ensure antennas match operating frequencies (e.g. VERT900 for\
    \ 800-900MHz,\n  VERT2450 for 2.4/5GHz). Transmitting on unauthorized frequencies\
    \ is illegal."
  edu_brick_title: How to Know If Your USRP Is Bricked
  edu_brick_sec1: ● Symptoms of a software brick
  edu_brick_body1: "  • Front LEDs remain off or stuck after power-on\n  • Device\
    \ does not respond to ping at 192.168.10.2\n  • uhd_find_devices cannot discover\
    \ the device"
  edu_brick_sec2: ● Recovery process
  edu_brick_body2: "  • X300/X310: Revive temporarily via micro-USB JTAG, then flash\
    \ via network.\n  • N200/N210: Hold S2 safe-boot button while powering on (safe\
    \ IP: 192.168.10.2).\n  • B200/B210: Does not use JTAG; re-enumerate via USB 3.0."
  edu_models_title: USRP Hardware Models Overview
  edu_models_body: "  ★ USRP X300 / X310\n    Kintex-7 FPGA, dual SFP+ (1G/10G), dual\
    \ daughterboards (SBX, UBX, TwinRX).\n    Recovery: Front micro-USB JTAG + network\
    \ flash.\n\n  ★ USRP N200 / N210\n    Spartan-3A DSP FPGA, Gigabit Ethernet.\n\
    \    Recovery: S2 safe-boot button / bootloader network flash.\n\n  ★ USRP B200\
    \ / B210 / B205mini\n    Integrated RFIC (AD9361/AD9364), USB 3.0 powered.\n \
    \   Recovery: Automatic FPGA load over USB 3.0.\n\n  ★ USRP N300 / N310 / N320\
    \ / E3xx\n    Embedded ARM Linux + RFNoC architecture."
