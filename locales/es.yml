  ping_fix2: '  • Configura la IP de tu equipo a 192.168.10.1 / máscara 255.255.255.0'
  ping_fix3: '  • Si el USRP está brickeado (sin LEDs) → usa ''Desbrickear por JTAG''
    primero'
