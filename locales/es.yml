  model_b200_label: USRP B200 / B210 (Carga automática por USB 3.0)
  proc_n210_title: PROCEDIMIENTO DE MODO SEGURO (N200 / N210)
  proc_n210_step1: 1. Apaga el USRP N210 desconectando el conector de alimentación.
  proc_n210_step2: 2. Mantén presionado el botón S2 mientras conectas la corriente.
  proc_n210_step3: 3. Esto fuerza al USRP a arrancar con una imagen segura de respaldo
    en IP 192.168.10.2.
  proc_n210_step4: 4. Si aún así no responde, conecta el cable Digilent USB JTAG al
    puerto JTAG de 6 pines.
  proc_x300_title: PROCEDIMIENTO JTAG PARA X300 / X310
  proc_x300_step1: 1. Conecta un cable micro-USB estándar al puerto frontal etiquetado
    como 'JTAG'.
  proc_x300_step2: 2. Enciende el equipo con el interruptor de encendido.
  proc_x300_step3: 3. Los adaptadores FTDI / Digilent integrados serán detectados
    automáticamente por el sistema.
