    \ ambos y vuelve a ejecutar usrp-manager."
  install_guide_linux: "1. Visita: https://digilent.com/reference/software/adept/start\n\
    \   2. Descarga los paquetes .deb o .rpm para Linux.\n   3. sudo dpkg -i digilent.adept.runtime_*.deb\n\
    \   4. sudo dpkg -i digilent.adept.utilities_*.deb"
  install_guide_mac: "1. Visita: https://digilent.com/reference/software/adept/start\n\
    \   2. Descarga el paquete para macOS e instálalo."
