flash:
  title: "Flashear FPGA por Red (permanente)"
  intro: "Escribe la imagen FPGA en la memoria flash interna del USRP.\nPersiste tras apagar el equipo.\nRequiere: cable Ethernet en el puerto SFP0 + configuración IP correcta."
  no_uhd: "UHD no está instalado o no está en el PATH. Por favor instala UHD primero."
  enter_ip: "Dirección IP del USRP"
  pinging: "Haciendo ping a %{ip}..."
  ping_ok: "USRP accesible en %{ip}"
  ping_fail: "No se puede alcanzar %{ip}. Posibles causas:"
  ping_fix1: "  • El cable Ethernet debe estar en el SFP0 (Puerto 0) con un transceptor SFP 1G"
  ping_fix2: "  • Configura la IP de tu equipo a 192.168.10.1 / máscara 255.255.255.0"
  ping_fix3: "  • Si el USRP está brickeado (sin LEDs) → usa 'Desbrickear por JTAG' primero"
  finding: "Detectando USRP con uhd_find_devices..."
  find_fail: "UHD no puede comunicarse con el USRP.\n   Posible causa: versión de UHD incompatible con la imagen FPGA."
  mismatch_hint: "Prueba 'Gestionar drivers UHD' para instalar la versión correcta de UHD."
  select_variant: "Selecciona variante de FPGA a flashear:"
  confirm_flash: "Esto sobreescribirá permanentemente la flash FPGA interna del USRP. ¿Continuar?"
  flashing: "Flasheando imagen FPGA. No apagues el USRP..."
  success: "¡Flash completado! Reinicia el USRP ahora."
  reboot_reminder: "IMPORTANTE: Apaga el USRP, espera 5 segundos y vuelve a encenderlo."

