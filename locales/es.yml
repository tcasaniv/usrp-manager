  bitstream_local: "[local]  %{name}"
  bitstream_download: "[descargar de GitHub]  v%{version} — %{size}"
  no_bitstream: "No hay imagen FPGA disponible. Descarga una desde 'Gestionar imágenes FPGA'."
  programming: "Programando FPGA por JTAG. No desconectes los cables..."
  success: "¡Programación JTAG exitosa!"
  success_detail: "La FPGA ahora ejecuta la imagen en RAM volátil.\nSe perderá al apagar el USRP."
  offer_permanent: "¿Flashear esta imagen permanentemente ahora? (recomendado)"
