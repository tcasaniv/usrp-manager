jtag:
  title: Desbrickear por JTAG
  intro: 'Este procedimiento carga una imagen FPGA en RAM a través del cable USB JTAG.

    El USRP volverá a funcionar (temporal — se borra al apagar).

    Después deberás flashear la imagen permanentemente por red.'
