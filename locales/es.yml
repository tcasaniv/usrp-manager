    Se perderá al apagar el USRP.'
  offer_permanent: ¿Flashear esta imagen permanentemente ahora? (recomendado)
  already_bricked_tip: Si falló la programación JTAG, comprueba que el cable USB está
    en el puerto JTAG (no en el puerto USB3).
  what_is_bricked: ¿Qué significa que tu USRP esté brickeado?
  what_is_bricked_body: 'Si un flasheo previo se interrumpió o la imagen se corrompió,
    el USRP no puede arrancar,

    quedando sin LEDs o sin responder a la red. Esto NO daña el hardware:

    la FPGA se puede revivir por JTAG.'
  how_jtag_works: ¿Cómo funciona la recuperación por JTAG?
