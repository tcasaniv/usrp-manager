  topic_back: ← Volver
  edu_what_title: ¿Qué es un USRP? (¿y qué es SDR?)
  edu_what_sec1: ● ¿Qué es SDR?
  edu_what_body1: "  Un USRP (Universal Software Radio Peripheral) es un dispositivo\
    \ hardware\n  fabricado por Ettus Research (National Instruments / Emerson) que\
    \ actúa\n  como Radio Definida por Software (SDR)."
  edu_what_sec2: ● ¿Cómo funciona?
  edu_what_body2: "  En lugar de circuitos fijos para cada estándar de radio (Wi-Fi,\
    \ LTE, FM),\n  un SDR utiliza un procesador de propósito general + FPGA para procesar\
    \ señales\n  por software. Permite: recepción FM/AM, GSM/LTE/5G, radar, satélites\
    \ y análisis espectral."
  edu_what_sec3: ● Rol de la FPGA
  edu_what_body3: "  La FPGA procesa señales digitales en tiempo real (conversión\
    \ DDC/DUC, filtros,\n  empaquetado) demasiado rápidas para una CPU. La PC ejecuta\
    \ UHD para controlar\n  el USRP mediante Ethernet o USB."
  edu_what_sec4: ● Por qué importan las versiones
  edu_what_body4: "  El driver UHD del host y la imagen FPGA deben ser de versiones\
    \ compatibles.\n  Si difieren, la comunicación falla y el USRP no puede operar."
  edu_fpga_title: La FPGA y por qué importa la versión
  edu_fpga_sec1: ● ¿Qué es la FPGA?
  edu_fpga_body1: "  FPGA = Field-Programmable Gate Array. Chip reprogramable que\
    \ ejecuta lógica\n  a velocidad de hardware para muestreo ADC/DAC, filtros y tramas\
    \ VITA49."
  edu_fpga_sec2: ● Imagen FPGA (archivo .bit / .bin)
  edu_fpga_body2: "  Es el binario que configura la FPGA. Cada versión de UHD implementa\
    \ un\n  protocolo interno específico que debe coincidir con la imagen grabada."
  edu_fpga_sec3: '● ⚠  Crítico: coincidencia de versión'
  edu_fpga_body3: "  La versión de UHD y la imagen FPGA deben coincidir exactamente\
    \ (ej. UHD 4.10\n  con imagen 4.10). De lo contrario, uhd_find_devices o uhd_usrp_probe\
    \ fallarán."
  edu_fpga_sec4: ● Cómo verificarlo
  edu_fpga_body4: "  Usa 'Diagnóstico del sistema' en esta herramienta para verificar\
    \ la versión\n  activa de UHD frente a las imágenes locales."
  edu_ant_title: 'Antenas: Seguridad RF y rangos de frecuencia'
  edu_ant_warn: LEE ESTO ANTES DE CONECTAR ANTENAS O TRANSMITIR
  edu_ant_sec1: ● Jamás transmitas sin antena o sin carga de 50Ω
  edu_ant_body1: "  Transmitir con un puerto abierto refleja la potencia RF directamente\
    \ hacia\n  el amplificador de potencia del USRP, pudiendo quemarlo permanentemente."
  edu_ant_sec2: ● Rangos de antena y legalidad
  edu_ant_body2: "  Verifica que las antenas cubran las frecuencias deseadas (ej.\
    \ VERT900 para\n  800-900MHz, VERT2450 para 2.4/5GHz). Transmitir en frecuencias\
    \ no autorizadas es ilegal."
  edu_brick_title: ¿Cómo saber si mi USRP está brickeado?
  edu_brick_sec1: ● Síntomas de un brickeo de software
  edu_brick_body1: "  • Los LEDs frontales no encienden o quedan congelados al encender\n\
    \  • El equipo no responde al ping en 192.168.10.2\n  • uhd_find_devices no encuentra\
    \ el dispositivo"
  edu_brick_sec2: ● Proceso de recuperación
  edu_brick_body2: "  • X300/X310: Revivir temporalmente por micro-USB JTAG y luego\
    \ flashear por red.\n  • N200/N210: Mantener presionado botón S2 al encender (IP\
    \ segura: 192.168.10.2).\n  • B200/B210: No requiere JTAG; carga automática de\
    \ firmware por USB 3.0."
  edu_models_title: 'Modelos USRP: X300, X310, N210, B2xx'
  edu_models_body: "  ★ USRP X300 / X310\n    FPGA Kintex-7, doble SFP+ (1G/10G),\
    \ 2 ranuras para hijas (SBX, UBX, TwinRX).\n    Recuperación: JTAG micro-USB frontal\
    \ + flasheo por red.\n\n  ★ USRP N200 / N210\n    FPGA Spartan-3A DSP, Gigabit\
    \ Ethernet.\n    Recuperación: Botón modo seguro S2 / flasheo de arranque por\
    \ red.\n\n  ★ USRP B200 / B210 / B205mini\n    RFIC integrado (AD9361/AD9364),\
    \ conexión y alimentación USB 3.0.\n    Recuperación: Carga dinámica automática\
    \ por USB 3.0.\n\n  ★ USRP N300 / N310 / N320 / E3xx\n    Arquitectura embebida\
    \ con Linux ARM y RFNoC."
