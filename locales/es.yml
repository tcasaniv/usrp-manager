jtag:
  title: "Desbrickear por JTAG"
  intro: "Este procedimiento carga una imagen FPGA en RAM a través del cable USB JTAG.\nEl USRP volverá a funcionar (temporal — se borra al apagar).\nDespués deberás flashear la imagen permanentemente por red."
  no_djtgcfg: "djtgcfg no está instalado."
  install_guide_title: "Cómo instalar Digilent Adept Utilities:"
  install_guide_win: "1. Visita: https://digilent.com/reference/software/adept/start\n   2. Descarga 'Adept 2 Runtime' y 'Adept Utilities' para Windows.\n   3. Instala ambos y vuelve a ejecutar usrp-manager."
  install_guide_linux: "1. Visita: https://digilent.com/reference/software/adept/start\n   2. Descarga los paquetes .deb o .rpm para Linux.\n   3. sudo dpkg -i digilent.adept.runtime_*.deb\n   4. sudo dpkg -i digilent.adept.utilities_*.deb"
  install_guide_mac: "1. Visita: https://digilent.com/reference/software/adept/start\n   2. Descarga el paquete para macOS e instálalo."
  enumerating: "Enumerando dispositivos JTAG..."
  no_devices: "No se encontraron dispositivos JTAG.\n   • Comprueba que el cable USB JTAG está conectado al puerto JTAG del USRP\n   • Comprueba que el USRP está encendido\n   • Prueba con otro cable USB o puerto"
  select_device: "Selecciona dispositivo JTAG:"
  initializing: "Inicializando cadena de escaneo JTAG..."
  fpga_detected: "FPGA detectada: %{fpga} → USRP %{usrp}"
  fpga_unknown: "FPGA detectada pero modelo no reconocido: %{id}\n   Este modelo de USRP puede no estar soportado todavía."
  select_variant: "Selecciona variante de FPGA:"
  variant_hg: "HG — Puerto 0 a 1 Gigabit, Puerto 1 a 10 Gigabit (más común)"
  variant_xg: "XG — Ambos puertos a 10 Gigabit"
