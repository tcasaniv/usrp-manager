[package]
name = "usrp-manager"
version = "0.2.3"
edition = "2021"
description = "Interactive CLI for managing Ettus Research USRP SDR devices"
authors = ["tcasaniv <https://github.com/tcasaniv>"]
license = "MIT"
repository = "https://github.com/tcasaniv/usrp-manager"
keywords = ["usrp", "sdr", "fpga", "ettus", "uhd"]
categories = ["command-line-utilities", "hardware-support"]

[[bin]]
name = "usrp-manager"
path = "src/main.rs"

[dependencies]
dialoguer  = { version = "0.11", features = ["fuzzy-select"] }
indicatif  = "0.17"
console    = "0.15"
rust-i18n  = "3"
reqwest    = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
zip        = "2"
sha2       = "0.10"
hex        = "0.4"
which      = "6"
dirs       = "5"
anyhow     = "1"
thiserror  = "2"
chrono     = { version = "0.4", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level     = 3
strip         = true
lto           = true
codegen-units = 1

[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"
